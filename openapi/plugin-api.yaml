        练习会话命令的公共输入。不同命令会读取其中一部分字段；未列出的扩展字段以运行时 `GET /guide` 为准。
      properties:
        windowId:
          type: string
          description: 可选。面板调用时通常由宿主按当前窗口补齐。
        expectedTopicId:
          type: string
          description: 可选。用于确认当前窗口仍在预期学习集。
        requestId:
          type: string
          description: 调用方生成的幂等标识。重试同一命令时复用。
        runId:
          type: string
          description: 指定练习会话趟数。部分命令可省略，使用当前趟。
        attemptId:
          type: string
          description: 指定某次尝试。评估、退出、恢复类命令可能需要。
        questionId:
          type: string
          description: 题目卡片或作答载体的身份。
        carrier:
          type: string
          description: 作答载体，例如 `focus` 或 `blank`。
        confirm:
          type: boolean
          description: 写操作确认。面板调用时 MarginNote 会补上。
      additionalProperties: true
    WritingSessionCommandResponse:
      type: object
      description: |
        练习会话命令的公共响应。结果可能是已完成、待查询、被拒或需要重新读取状态；
        不要只看 HTTP 状态码。
      properties:
        schemaVersion:
          type: integer
        bridgeApiVersion:
          type: string
        requestId:
          type: string
        runId:
          type: string
        attemptId:
          type: string
        state:
          type: string
        outcome:
          type: string
        settled:
          type: boolean
        persisted:
          type: boolean
        ready:
          type: boolean
        canSwitch:
          type: boolean
        code:
          type: string
          description: 受理之后才出现的失败码，走该项而不是 `error.code`。
      additionalProperties: true
    WritingTransitionRequest:
      type: object
      description: 作答转场命令的公共输入。不同路由会读取其中一部分字段。
      properties:
        windowId:
          type: string
        expectedTopicId:
          type: string
        requestId:
          type: string
          description: 调用方生成的幂等标识。后续查询 `transition-result` 时使用。
        questionId:
          type: string
          description: 要进入或开始作答的题目。
        carrier:
          type: string
          description: 作答载体，例如 `focus` 或 `blank`。
        runId:
          type: string
        attemptId:
          type: string
        confirm:
          type: boolean
          description: 写操作确认。面板调用时 MarginNote 会补上。
      additionalProperties: true
    WritingTransitionResultRequest:
      type: object
      required:
        - requestId
      properties:
        windowId:
          type: string
        expectedTopicId:
          type: string
        requestId:
          type: string
          description: 发起转场时使用的请求标识。
      additionalProperties: true
    WritingTransitionResponse:
      type: object
      description: 作答转场结果。看 `settled`、`outcome`、`ready` 与 `canSwitch`，不要只看 HTTP 状态码。
      properties:
        schemaVersion:
          type: integer
        bridgeApiVersion:
          type: string
        requestId:
          type: string
        state:
          type: string
          description: 受理时可能为 `pending`。
        settled:
          type: boolean
        outcome:
          type: string
        ready:
          type: boolean
        canSwitch:
          type: boolean
        scope:
          type: string
        code:
          type: string
          description: 受理之后才出现的失败码，走该项而不是 `error.code`。
        layerLeaseUnresolved:
          type: boolean
          description: 为 `true` 时结果不确定，不要自动重试，先读取状态。
      additionalProperties: true
    WritingPreviewResponse:
      type: object
      description: 某一趟作答中已退出的尝试所留下的笔迹预览。只读。
      properties:
        schemaVersion:
          type: integer
          description: 该响应的结构版本。
        state:
          type: string
          description: 没有笔迹时返回 `no-stored-ink`。该值仅表示该层没有保存的笔迹，不代表整道题没有内容。出现其他取值时按未知字符串处理。
          enum:
            - no-stored-ink
        scope:
          type: string
          description: 预览覆盖的范围。
        coverage:
          type: string
          description: 预览包含哪一类内容。仅包含专用层中已保存的笔迹项，不包含未分层的文字与图片框。
        readOnly:
          type: boolean
          description: 固定为 `true`。该接口不写任何内容。
        attemptId:
          type: string
          description: 该次作答的身份。
        runId:
          type: string
          description: 该次作答所属的趟。
        number:
          type: integer
          description: 该次作答在本趟里的次序。
        questionId:
          type: string
          description: 该次作答所属的题目。
        carrier:
          type: string
          description: 该次作答所在的位置。
        topicid:
          type: string
          description: 该次作答所属的学习集。
        partCount:
          type: integer
          description: 取到的笔迹项数。
        includesUnsavedCanvas:
          type: boolean
          description: 固定为 `false`。未保存的画布不在预览里。
        pngBase64:
          type: string
          description: base64 编码的预览图。有尺寸上限，超出上限时该字段不返回。
        bridgeApiVersion:
          type: string
          description: 宿主的接口版本。
    SkillResponse:
      type: object
      description: 本机 helper skill 内容与刷新入口。
      properties:
        bridgeApiVersion:
          type: string
        skill:
          type: object
          additionalProperties: true
        refreshShRoute:
          type: string
        refreshPowerShellRoute:
          type: string
      additionalProperties: true
    DevicesResponse:
      type: object
      description: 已配对设备摘要，不包含令牌材料。
      properties:
        bridgeApiVersion:
          type: string
        devices:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              platform:
                type: string
              pairedAt:
                type: string
            additionalProperties: true
      additionalProperties: true
    AnkiCapabilitiesResponse:
      type: object
      description: Anki 导出能力清单。
      properties:
        contractVersion:
          type: integer
        jobRoute:
          type: string
        uploadRoute:
          type: string
        downloadRoute:
          type: string
        sessionScopedArtifacts:
          type: boolean
        operations:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
      additionalProperties: true
    AnkiJobResponse:
      type: object
      description: Anki 导出作业状态。
      properties:
        jobId:
          type: string
        state:
          type: string
        operation:
          type: string
        progress:
          type: number
        artifacts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              mimeType:
                type: string
              size:
                type: integer
            additionalProperties: true
        code:
          type: string
      additionalProperties: true
    DocumentExportPlanResponse:
      type: object
      description: 文档导出计划状态。
      properties:
        planId:
          type: string
        state:
          type: string
        exportId:
          type: string
        exportRoute:
          type: string
        downloadRoute:
          type: string
        selectedPageCount:
          type: integer
        progress:
          type: number
        code:
          type: string
      additionalProperties: true
    LegacySyncStatusResponse:
      type: object
      description: 整机的同步诊断快照。不含笔记正文、文档名、账号与云端记录标识。
      properties:
        cloudKit:
          type: object
          properties:
            errorCount:
              type: number
              description: 本进程保留的历史诊断数。
            suspensionNeedsAttention:
              type: boolean
              description: 状态为暂停时必须看该项。为 `false` 时暂停可能只是正常的增量拉取间歇。
            suspensionErrorCount:
              type: number
              description: 本轮暂停里的错误次数。不要用历史总数代替。
          additionalProperties: true
        documents:
          type: object
          additionalProperties: true
        diagnostic:
          type: object
          additionalProperties: true
    LegacySyncEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        lastSequence:
          type: number
          description: 继续取时用作 `afterSequence`。
        hasMore:
          type: boolean
          description: 为 `true` 表示还有可取的事件。
        historyTruncated:
          type: boolean
          description: 起点已早于本机的滚动记录窗口，或窗口内出现过记录缺口。此时不能声称中间阶段是完整的。
        cursorAdvancedPastGap:
          type: boolean
          description: 缺口之后已无事件可返回，MarginNote 将游标推至当前位置，避免调用方反复请求空结果。
        cursorAhead:
          type: boolean
          description: 表示调用方的游标与当前资料库或设备不符，游标应当重置。
    BundleEntry:
      type: object
      properties:
        bundleId:
          type: string
        jobId:
          type: string
        bundlePath:
          type: string
          description: 包在磁盘上的位置。
        topicid:
          type: string
        bookmd5:
          type: string
        createdAt:
          type: string
        state:
          type: string
          description: >-
            包的状态。`preparing` 表示作业运行中，同时返回 `progress`；
            `prepared` 与 `imported` 表示包可用，同时返回 `version` 与 `rootNoteId`；
            `failed` 表示作业失败，或 App 中途重启后遗留的残留，同时返回 `error`，须调用删除任务包接口清理；
            `cancelled` 表示包已取消。仅 `prepared` 与 `imported` 视为可用，其余各档一律视为不可用。
          enum:
            - preparing
            - prepared
            - imported
            - failed
            - cancelled
        version:
          type: number
          description: 已导入的次数，0 表示还没导入。只在已准备与已导入的条目上出现。
        rootNoteId:
          type: string
          description: 导入后生成的根卡。只在已准备与已导入的条目上出现。
        progress:
          type: object
          description: 只在正在准备的条目上出现。
          properties:
            pagesDone:
              type: number
            pagesTotal:
              type: number
        running:
          type: boolean
          description: 只在作业条目上出现。
        error:
          type: string
          description: 失败条目上的原因。
