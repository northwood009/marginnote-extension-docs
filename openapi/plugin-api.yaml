  /study-sets/{topicid}/tree:
    get:
      tags:
        - 学习集与卡组
      summary: 获取学习集脑图
      operationId: getStudySetsTopicidTree
      description: |
        读整个学习集的脑图结构、标题与逻辑属性。

        节点是扁平数组，父子关系靠每一项的 `parent` 自行组合，没有嵌套的下层数组。

        要按文档顺序排列时带 `sort=document`。不要自行按页码排序：摘录与摘题产出的卡自身没有
        页码，页码在该题的摘录子笔记上。带该参数时由 MarginNote 排序，判据与界面上的按页码排序逐字一致，
        并给每个节点补上 `docPage` 与 `docBookmd5`。排序在切片之前对整条序列做，跨页顺序因此是对的。

        翻页用 `limit` 与 `cursor`，响应里的 `nextCursor` 为 `null` 表示已到末尾。
        达到遍历上限时 `walkLimitReached` 为真，为真时才表示读到末页也取不全。
      parameters:
        - $ref: '#/components/parameters/Topicid'
        - $ref: '#/components/parameters/TreeRoot'
        - $ref: '#/components/parameters/TreeLimit'
        - $ref: '#/components/parameters/TreeCursor'
        - $ref: '#/components/parameters/SortDocument'
        - $ref: '#/components/parameters/WithNotes'
      responses:
        '200':
          description: 脑图。节点是扁平数组，父子关系靠 `parent` 字段表示。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeResponse'
