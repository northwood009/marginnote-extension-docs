        `settled` 为真只说明返回调已返回，还要分别看 `outcome`、`persistedSnapshotVerified`
        与 `snapshotCurrent`。`snapshotCurrent` 只描述返回调返回时的状态。

        受理之后才出现的失败码走响应里的 `code`，不走错误对象里的 `code`。
