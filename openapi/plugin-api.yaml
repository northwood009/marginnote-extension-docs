                      card: B9F3696A-AF8A-43B2-A8A2-2791717F1695
                      self: again
                      reason: careless
                      reasonLabel: 粗心
                      at: 1791273090.0
                    hashtags:
                    - '#practice/question'
                    - '#practice/again'
                    - '#practice/error/careless'
                    tagsChanged: true
                    commentsRevision: '4'
                    bridgeApiVersion: '0.91'
                measured:
                  summary: 实测于 2026-10-07，App 0.91
                  value:
                    noteid: EB3BA5C0-4850-4713-9A73-BAE677983F5E
                    hashtags:
                    - '#practice/question'
                    - '#practice/todo'
                    - '#practice/error/careless'
                    persisted: true
                    tagsChanged: true
