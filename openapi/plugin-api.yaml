  /notes/addon-values:
    post:
      tags:
        - 卡片与摘录
      summary: 更新卡片插件字段
      operationId: postNotesAddonValues
      description: |
        把插件自己的数据写到卡片上，单次上限为 200 张卡与 50 个键。值写 `null` 表示删掉该键。

        面板会把 `addon` 改写为本面板所属插件的 owner，页面填的值不会生效，因此写不到别的
        插件名下。`confirm` 由 MarginNote 补上。

        响应里的 `persisted` 是独立重新读取、核对一致之后才返回的，据此判断写入是否成功。批量写入不经过
        提交，需要在同一步里改动多项时用 `POST /notes/{noteid}/edits`。
      responses:
        '200':
          description: 响应。可能还有未列出的字段。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteAck'
              examples:
                assembled:
                  summary: 构造示例，未实测
                  value:
                    persisted: true
                measured:
                  summary: 实测于 2026-10-07，App 0.91
                  value:
                    persisted: true
                    addon: mn.apiprobe
                    bridgeApiVersion: '0.91'
                    items:
                    - values:
                        n: 3
                        probe: hello
                        ok: true
                      title: ''
                      written: true
                      noteid: D3085422-2CB9-4B68-A78D-DEE351CF9C38
                    affectedCount: 1
                    failedWrites: 0
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddonValuesRequest'
            examples:
              recordStatus:
                summary: 给一张卡记录状态
                value:
                  noteIds:
                    - 5880F73A-3A6D-4464-9D6F-88F60285401E
                  values:
                    status: done
                    pick: 2
                  confirm: true
      x-codeSamples:
        - lang: javascript
          label: 记录一个状态字段
          source: |
            await mn.api('/notes/addon-values', {
              method: 'POST',
              // addon 由 MarginNote 设为本面板的 owner，此处填写不生效
              body: { noteIds: [noteid], values: { status: 'done' }, confirm: true }
            });
  /notes/hashtags:
