  /bundles:
    get:
      tags:
        - 任务包与同步诊断
      summary: 列出任务包
      operationId: getBundles
      description: |
        列出现存的拆书任务包，包含运行中的作业，以及 App 重启后留在磁盘上的目录。各条目的字段含义见 `BundleEntry`。

        条目的时间基准随类别不同。磁盘上的包按目录创建时间计，作业条目按作业
        开始时间计。因此运行中的长作业不会因为开始时间早于 `since` 而从增量轮询里消失，
        该条目的时间戳也不会随进度前进。

        缺少的可选字段视为该字段不存在，不得视为空值。

        `jobId` 说明不了作业所属的会话。经 prepare 登记的包都有该字段，App 重启后由磁盘标记
        回带的包也有，判断作业是否属于本轮要看 `state`。

        响应里不含标题、预设与来源。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: 任务包与作业条目。条目可能还有未列出的字段，外层结构的键名未取到。
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {}
                    description: 实测为空数组，条目结构没有依据。
                  bridgeApiVersion:
                    type: string
                  bundles:
                    type: array
                    items:
                      $ref: '#/components/schemas/BundleEntry'
                    description: ⚠️
                description: 外层键名未取到，条目结构见 `BundleEntry`。
              examples:
                assembled:
                  summary: 一条运行中的作业与一条已导入的包，构造示例
                  value:
                    bundles:
                    - bundleId: 6F1C0A44-7E3B-4A21-9A55-0B2D8C1E99A1
