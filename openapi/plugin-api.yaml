  /notes/{noteid}/practice-verdict:
    post:
      tags:
        - 卡片与摘录
      summary: 提交作答判定
      operationId: postNotesNoteidPracticeVerdict
      description: |
        把本次作答的判定写下来：是否掌握，以及错因。

        要带 `expectedRevision`，与打开作答纸时用的是同一个版本号。

        出现下列情形时判定不会写下：

        - `PRACTICE_CONFIG_UNAVAILABLE`：当前场景没有给该插件声明标签前缀与错因清单。该项配置取自 `GET /immersive/template` 的 `plugins[].config`。
        - `PRACTICE_TOPIC_CHANGED`：这道题不属于当前学习集。须刷新重读后重新提交，原地重试得到同样的结果。
        - `PRACTICE_KEY_INVALID`：身份无法写出。

        后两者发生在写入之前，没有任何改动生效。
      parameters:
        - $ref: '#/components/parameters/Noteid'
      responses:
        '200':
          description: 响应。可能还有未列出的字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  noteid:
                    type: string
                    description: 作答所属的卡片。
                  hashtags:
                    type: array
                    items:
                      type: string
                    description: 判定写完之后该卡上的标签。前缀、状态与错因三段来自场景模板的配置。
                  persisted:
                    type: boolean
                    description: 判定是否已经落盘。
                  tagsChanged:
                    type: boolean
                    description: 本次调用是否改动了标签。
                  commentsRevision:
                    type: string
                    description: 写完之后该卡批注的新版本。字符串形态，回传时原样带回。
                  practice:
                    type: object
                    properties:
                      reason:
                        type:
                        - 'null'
                        - string
                        description: 错因代码。判定为掌握时该字段与 `reasonLabel` 同为 `null`。
                      card:
                        type: string
                        description: 判定所属的卡片。
                      topic:
                        type: string
                        description: 判定所属的学习集。
                      self:
                        type: string
                        enum:
                          - got
                          - again
                        description: 写下的判定结论。`got` 表示掌握，`again` 表示仍需练习。
                      reasonLabel:
                        type:
                        - 'null'
                        - string
                        description: 错因在界面上显示的名字。判定为掌握时为 `null`。
                      at:
                        type: number
                        description: 判定写下的时间，Unix 秒级时间戳，带小数。
                      addon:
                        type: string
                        description: 判定的归属插件。
                    required:
                    - reason
                    - card
                    - topic
                    - self
                    - reasonLabel
                    - at
                    - addon
                    description: 写下的判定内容。
                  commentId:
                    type: string
                  bridgeApiVersion:
                    type: string
                required:
                - noteid
                - hashtags
                - persisted
                - tagsChanged
                - commentsRevision
                - practice
                - commentId
                - bridgeApiVersion
              examples:
                assembled:
                  summary: 构造示例，未实测
                  value:
                    persisted: true
                    noteid: B9F3696A-AF8A-43B2-A8A2-2791717F1695
                    commentId: 1F4C2A90-6C2B-4E1F-9F3A-2B7C1D5E8A44
                    practice:
