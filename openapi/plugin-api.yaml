      summary: 更新卡片标签
      operationId: postNotesHashtags
      description: |
        一次给多张卡加标签、摘标签或替换标签，一次最多 200 张卡、100 个标签。
        每个标签写一条完整的叶子路径，层级之间用 `/` 分隔。

        摘标签时可以带上 `includeDescendants`，把下层的标签一并摘掉；加与替换不接受该项。
        标签不能借改正文的途径写入，正文里出现标签控制行会被拒，响应会注明该用哪个接口。

        一次提交多组互不相同的操作时用 `patches`。
