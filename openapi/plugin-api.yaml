  /notes/{noteid}/merge-branch:
    post:
      tags:
        - 卡片与摘录
      summary: 合并子卡
      operationId: postNotesNoteidMergeBranch
      description: |
        把子卡的内容并进该卡，等同于卡片菜单上的合并分支。默认只并直接子卡，
        带 `recursive` 时连整棵子树一起并。

        并非所有子卡都会被并入：拒绝接收的卡原样留在树上，数量看响应里的 `notMergedCount`；
        摘要卡与子脑图根卡会被自动跳过，原因在 `skipped` 里。

        响应里的 `willMerge` 是本次计划并入的卡，可据此先检查再决定是否提交。
