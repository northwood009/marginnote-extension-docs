                          properties:
                            carrier:
                              type: string
                            questionId:
                              type: string
                      lastRequestId:
                        type: string
                      topicid:
                        type: string
                  started:
                    type: boolean
                    description: ⚠️
                  ready:
                    type: boolean
                    description: ⚠️
                  canSwitch:
                    type: boolean
                    description: ⚠️
                  code:
                    type: string
                    description: ⚠️受理之后才出现的失败码。
              examples:
