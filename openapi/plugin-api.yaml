        '200':
          description: 响应。可能还有未列出的字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  persisted:
                    type: boolean
                  operation:
                    type: object
                    properties:
                      appliedRevision:
                        type: integer
                        description: 本次请求带的版本号。
                      requestId:
                        type: string
                      replayed:
                        type: boolean
                  schemaVersion:
                    type: integer
                  bridgeApiVersion:
                    type: string
                  plan:
                    type: object
                    properties:
                      revision:
