        `reference` 建立与来源保持同步的引用卡，改一处两边一起变；`clone` 建立各自独立的卡片，
        并重写分支内部的链接。

        该接口的 `confirm` 排在业务校验之后，不带 `confirm` 时先完成整套只读校验，再返回 `422`，
