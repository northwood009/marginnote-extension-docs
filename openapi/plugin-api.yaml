      operationId: postWritingSessionPreview
      description: |
        以只读方式取某一趟作答中已退出的尝试的专用层中已保存的笔迹，可以附带一张有
        尺寸上限的预览图。

        输入要精确到趟与尝试。不要传层身份、路径或渲染范围。

        `state` 的含义见 `WritingPreviewResponse`。该预览不含未保存的画布、未分层的文字与图片框。

        主数据上下文还有没保存的改动时会被拒，这是写入接口里唯一表示稍后重试的错误码。

        尝试记录由独立的练习插件保管，宿主另有一条判据，只允许该插件查看自己的尝试。
        命令行发起的调用不受该判据约束，本机实测可以取到预览。
