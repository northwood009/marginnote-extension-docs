      operationId: postWritingPlanSave
      description: |
        保存这本学习集的练习准备选择。该接口只记录本次意图，不展开留白，不切层，不导航，
        也不修改学习集。

        一次最多 20 道题，题目不能重复。传空数组表示清空准备选择，不会删掉题目或笔迹。

        要带 `expectedRevision`，与读回来的 `plan.revision` 对照。同一个标识换内容，
        或者使用旧版本号发新请求，都会返回冲突。
