  /bundles/{bundleId}/files:
    get:
      tags:
        - 任务包与同步诊断
      summary: 列出任务包文件
      operationId: getBundlesBundleIdFiles
      description: |
        不带 `path` 时列出包内文件。带 `path` 时返回该文件的原始内容，路径相对包根，层级用
        `/` 分隔。

        包内除 `manifest.json` 与 `source.json` 之外，还有若干标记文件：`.bridge` 标明
        该包经接口创建，导入后另写下 `.imported` 与 `import-receipt.json`。
        这些文件都不是供插件写入内容的位置。

        带 `path` 时响应不是 JSON，`mn.api` 会把 Response Body 当 JSON 解析并抛出语法错误，必须改用
        `fetch` 原语读取。
      parameters:
        - $ref: '#/components/parameters/BundleId'
        - $ref: '#/components/parameters/PathQuery'
      responses:
        '200':
          description: 包内文件清单，或一份文件的原始内容。带的参数不同，响应形态也不同。
          content:
            application/json:
              schema:
                type: object
                properties:
                  bridgeApiVersion:
                    type: string
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
