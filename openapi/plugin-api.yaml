          type: object
          properties:
            hasLearningData:
              type: boolean
        databaseQueryErrors:
          type: array
          description: 非空表示数据库一侧的结论只是部分证据。
          items:
            type: string
        originalDocument:
          type: object
          properties:
            expectedByCurrentSettings:
              type: boolean
        remainingUnverifiedMaterializedMappingCount:
          type: number
          description: 不为零时，该结论不能推广到其他映射上。
        activeDirectNoteReferenceCount:
          type: number
        studySetWithActiveNotesCount:
          type: number
