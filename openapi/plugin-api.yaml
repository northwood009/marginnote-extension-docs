              aiOCR:
                type: boolean
              structuredAIOCR:
                type: boolean
              aiOCRPromptChars:
                type: number
              highlightMode:
                type: number
                description: 高亮样式级别。
              colorIndex:
                type: number
              fillIndex:
                type: number
              insertAfterFocus:
                type: boolean
              addToMap:
                type: boolean
    ImmersiveReview:
      type: object
      properties:
        managedByTemplate:
          type: boolean
        autoAdd:
          type: string
