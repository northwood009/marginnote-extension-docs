  /documents/{bookmd5}/pages:
    get:
      tags:
        - 文档与页面
      summary: 获取文档页文本
      operationId: getDocumentsBookmd5Pages
      description: |
        按页范围读文本。没有文本层时 MarginNote 会先渲染再识别，因此该接口可能较慢。

        单次请求最多跨 60 页。页范围按 PDF 页序编号，第一页为 1。超出范围的页返回空文本，状态码仍为 `200`。

        带 `blocks=1` 时返回版面块的规则见参数说明，每块返回文字、类型与页内坐标。
        扫描类接口共用两个名额，名额满了会立即返回 `429`，不排队。

        新摘录进入全文索引有约十秒延迟，刚摘下来的内容不一定马上搜得到。
      parameters:
        - $ref: '#/components/parameters/Bookmd5'
        - $ref: '#/components/parameters/StartPage'
        - $ref: '#/components/parameters/EndPage'
        - $ref: '#/components/parameters/Blocks'
      responses:
        '200':
          description: 页文本。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagesResponse'
              examples:
                assembled:
                  summary: 构造示例，未实测
                  value:
                    pages:
                    - page: 12
                      text: 把街道还给行人的地方，店面反而活了下来。
                measured:
                  summary: 实测于 2026-10-07，App 0.91
                  value:
                    bookmd5: ec280b8dbd77594d16b090165fdd4c07ec280b8dbd77594d16b090165fdd4c07
                    pages:
                    - text: "'The Quiet Case for Walkable Streets Cities that took space back from cars did not win the argument. They simply stopped having it. Sample material written for the Reading Vocabulary template. Original text, no copyrighted source, not affiliated with any publication. Every weekday morning a city runs an experiment on its own residents, and measures almost nothing about the result. It asks a few hundred thousand people to cross several kilometres inside a narrow window of time, and it judges the outcome by a single number: how long the cars were stationary. The daily commute is the largest recurring transaction between a city and the people who live in it, and for most of the last century we designed it around one assumption, namely that the private car would carry the load. That assumption is now expensive to keep. Not because driving became unpopular, but because the arithmetic never worked. A lane of road moves a fixed number of vehicles per hour no matter how much money is spent on it, and every vehicle that arrives somewhere must be stored there. The real issue is not congestion, which is a symptom. It is that motion and storage compete for the same square metres, and storage always wins, because a parked car occupies its space twenty-two hours a day and pays nothing for the privilege. A plan that nobody would approve today The Dutch city of Groningen offers the clearest counter-example, mostly because it acted before anyone had a vocabulary for what it was doing. The traffic circulation plan proposed in 1977 cut the historic centre into four wedges and made it impossible to drive from one wedge to another without first returning to a ring road. Nothing was banned. Driving to any address remained legal and possible. It was merely made slower than walking, and slower than the bicycle, for the short trips that make up most of an ordinary day. The reaction was what you would expect. Shopkeepers predicted ruin and organised against it; the usual NIMBY objections arrived on schedule from streets that were not even affected. A local paper ran a front page calling the council reckless. Two years later the same shopkeepers asked for the treatment to be extended to their own streets, which is the part of the story that planners tell most often and politicians believe least. '"
                      page: 1
                    - text: "'What makes the case persuasive is not the outcome but the method. The council did not charge drivers a penny to enter the centre, and it did not build anything grand. It changed the order in which existing streets connect to one another, using paint, bollards and a revised set of signs. The budget was trivial. The city worked with the capabilities it already had, rather than the ones it would have needed to buy, and that distinction is why the plan is copyable and a new metro line is not. What travels between cities, and what does not Planners like to point out the similarities between the places that have done this well: a dense pre-war core, a flat surface, a university, a population small enough to cross on foot in half an hour. The list is accurate and slightly misleading, because it invites every other city to conclude that the lesson does not apply to it. Ghent is not flat in the way that matters. Pontevedra had no bicycle culture to lean on. What these places share is not geography but sequencing: each removed the through-traffic first and argued about the parking afterwards. Measurement is where the argument usually goes wrong. Most walkability indices score a neighbourhood by counting what sits within a fifteen-minute radius, which rewards density and punishes everything else. They cannot see whether the pavement is wide enough for two people to pass, whether the crossing gives you eleven seconds or twenty- six, whether the route is pleasant after dark. Those things are decided at a much finer granularity than any index operates at, and they are exactly the things that determine whether a person walks. This is not an argument against cars, and it is worth saying so plainly, because the tone of the debate punishes anyone who forgets to. A city that is easy to cross on foot is also a city where a delivery van finds a kerb, an ambulance finds a clear lane, and the people who genuinely need to drive are not queuing behind the ones who would rather not. The quiet case for walkable streets is not that driving is wrong. It is that a street forced to do every job at once ends up doing all of them badly. Sample article for the Reading Vocabulary template. Written for this purpose; any resemblance to a specific publication''s layout or voice is unintended. '"
                      page: 2
                    - text: ''
                      page: 3
                    bridgeApiVersion: '0.91'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-codeSamples:
        - lang: javascript
          label: 获取页文本
          source: |
            const r = await mn.api('/documents/' + bookmd5 + '/pages?start=' + page + '&end=' + page);
            if (r.error && r.error.code === 'SCAN_BUSY') {
              // 扫描名额已满，按 details.retryAfterSeconds 等待后重发
              mn.log(r.error.details.retryAfterSeconds);
            }
            mn.log(r.pages[0].text);
