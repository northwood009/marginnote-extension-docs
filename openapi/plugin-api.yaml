      operationId: postWritingPencilCommit
      description: |
        将当前焦点根画布上的笔迹保存为快照。该接口只作用于当前焦点根画布，不写入整份编辑器，也不切换题目。

        该接口立即返回受理，`state` 为 `pending`。受理不是完成，结果要用 `POST /writing/pencil-result`
        用同一个 `requestId` 去查。

        同一个标识配同一个请求只返回原结果，不会重做；不同的目标共用同一个标识会返回冲突。
        每个窗口同时只准有一笔未完成的操作。MarginNote 重启之后这些记录会消失，因此查不到不等于没保存过，
        要独立读回确认。
