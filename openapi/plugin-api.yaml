                        title:
                          type: string
                        before:
                          type: array
                          items: {}
                          description: 实测为空数组，条目结构没有依据。
                        after:
                          type: array
                          items:
                            type: string
                        noteid:
                          type: string
                  patches:
                    type: array
                    description: ⚠️批量形态下按组返回的响应。
