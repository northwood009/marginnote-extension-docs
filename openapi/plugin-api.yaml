        - requestId
        - target
        - confirm
      properties:
        windowId:
          type: string
        expectedTopicId:
          type: string
        surfaceId:
          type: string
          description: 要保存的画布。取自 `POST /writing/context` 响应里 `surfaces[].surfaceId`。
        requestId:
          type: string
          description: 本次操作的标识，用 UUID。相同的标识配相同的请求只返回原结果，不会重做一次；不同的目标共用同一个标识返回冲突。
        target:
          type: object
          description: 存储身份，要与当前焦点一致。
          properties:
            topicid:
              type: string
            noteid:
              type: string
            layerId:
              type: string
              description: 默认层传空串。
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    WritingPencilDocumentCommitRequest:
      type: object
      required:
        - requestId
        - writer
        - target
        - confirm
      properties:
        windowId:
          type: string
        expectedTopicId:
          type: string
        surfaceId:
          type: string
          description: 必须是本窗口的文档面。
        requestId:
          type: string
          description: 同 `pencil-commit`，用 UUID。
        writer:
          type: string
          enum:
            - continuous
            - paged
          description: 连续阅读或翻页。该项不替调用方切换阅读与手写模式。
        target:
          type: object
          description: 从 `POST /writing/context` 返回的 `state.visiblePages[].continuousCommitTarget` 或 `pagedCommitTarget` 原样返回。取到 `null` 表示这条路径当前不可用。
          additionalProperties: true
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    WritingPencilResultRequest:
      type: object
      required:
        - requestId
      properties:
        windowId:
          type: string
        expectedTopicId:
          type: string
        requestId:
          type: string
          description: 与提交时同一个标识。
    WritingPlanSaveRequest:
      type: object
      required:
        - requestId
        - expectedRevision
        - questions
        - confirm
      properties:
        windowId:
          type: string
        expectedTopicId:
          type: string
        requestId:
          type: string
        expectedRevision:
          type: integer
          description: 读到的版本号，取值 0 到 256。与 `POST /writing/plan-read` 响应里的 `plan.revision` 对照。
        questions:
          type: array
          maxItems: 20
          description: 本次准备作答的题目。传空数组表示清空准备选择，不会删掉题目或笔迹。
          items:
            type: object
            required:
              - questionId
              - carrier
            properties:
              questionId:
                type: string
              carrier:
                type: string
                enum:
                  - blank
                  - focus
        confirm:
          type: boolean
          description: 必填。由 MarginNote 自动补上。
    WritingResolveRequest:
      type: object
      required:
        - topicid
        - questionId
      properties:
        topicid:
          type: string
        questionId:
          type: string
    WritingSessionPreviewRequest:
      type: object
      required:
        - runId
        - attemptId
      properties:
        windowId:
          type: string
        expectedTopicId:
          type: string
        runId:
          type: string
        attemptId:
          type: string
        windowId2:
          type: string
          description: 保留位，不使用。
    WritingLeasesRequest:
      type: object
