          type: boolean
          description: 固定为 `false`。
    SyncStatusResponse:
      type: object
      description: 单个文档的同步核对。
      properties:
        state:
          type: string
          description: >-
            核对结论。`available_local_only` 与 `available_and_published` 表示可用；
            `waiting_for_icloud_download` 与 `mapped_but_not_materialized` 表示内容尚未取得；
            其余表示映射缺失、内容不一致或提供方未核实。
          enum:
            - database_reference_without_document_mapping
            - waiting_for_icloud_download
            - library_record_without_document_mapping
            - available_local_only
            - available_and_published
            - verified_mismatch
            - icloud_error
            - mapped_but_not_materialized
            - unverified_external_provider
