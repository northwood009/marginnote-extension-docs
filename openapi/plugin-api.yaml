  /study-sets/{topicid}/hashtags:
    get:
      tags:
        - 学习集与卡组
      summary: 获取标签树
      operationId: getStudySetsTopicidHashtags
      description: |
        读整个学习集的标签：实际存储的标签、扁平展开的层级、嵌套的层级树。

        `nodes` 是扁平数组，`tree` 是嵌套数组，卡片 id 只挂在扁平的 `nodes` 上。
        `directCardCount` 只统计明确存了该条完整路径的卡，`cardCount` 还包含所有下层路径
        覆盖到的卡。`derived` 的含义见字段说明。

        传入 `withNotes=1` 时，卡片 id 的返回规则见参数说明；数量超出 `noteIdLimit` 时仅标记截断，不自动省略。
      parameters:
        - $ref: '#/components/parameters/Topicid'
        - $ref: '#/components/parameters/WithNotes'
      responses:
        '200':
          description: 标签树。卡片 id 只在扁平的 `nodes` 上。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HashtagsResponse'
              examples:
                recorded:
                  summary: 真机实录（MarginNote 0.61，2026-09-18 录制）
                  value: {
                      "bridgeApiVersion": "0.61",
                      "storedHashtagCount": 2,
                      "hashtags": [
                        "#FormulaPending",
                        "#practice/question"
                      ],
                      "title": "理工公式对照材料 · 样例",
