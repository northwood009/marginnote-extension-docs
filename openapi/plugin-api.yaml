  /guide:
    get:
      tags:
        - 能力与状态
      summary: 获取运行时规程
      operationId: getGuide
      description: |
        返回一份 Markdown 文档，内容是 MarginNote 写给接入方的运行时规程：连接与鉴权、各接口的 Request Body 写法、
        以及一批使用上的陷阱。
        整张路由表里只有该接口返回 Markdown，因此 `mn.api` 无法读取。`mn.api` 相当于
        `fetch('/bridge/v1' + path, opts).then(r => r.json())`，始终按 JSON 解析，
        Markdown 会让 `mn.api` 抛出 `SyntaxError`。读取该接口须改用 `fetch`。
      responses:
        '200':
          description: 规程全文，Markdown。响应头里的内容类型是 `text/markdown; charset=utf-8`。
          content:
            text/markdown:
              schema:
                type: string
              examples:
                recorded:
                  summary: 正文开头，摘自真机实录
                  value: |
                    # MN Agent Bridge 使用技能（mn-bridge SKILL v0.91）

                    本规程由 App 的 `GET /guide` 提供，不再整份安装到本地。
      x-codeSamples:
        - lang: javascript
          label: 改用 fetch 原语读取
          source: |
            // mn.api 会失败：该函数按 JSON 解析，该接口返回 Markdown
            const md = await (await fetch('/bridge/v1/guide')).text();

            // 按版本号与哈希缓存；只按版本号缓存会漏掉正文改写
            const caps = await mn.api('/capabilities');
            const { version, sha256 } = caps.guide;
