                additionalProperties: true
        pagesScanned:
          type: number
          description: 为 0 表示页范围越界或整段为留白，此时不返回 `nextStart`。
        truncated:
          type: boolean
          description: 扫描页数达到单次跨度上限，仅返回已扫描的部分。
        nextStart:
          type: number
        hint:
          type: string
