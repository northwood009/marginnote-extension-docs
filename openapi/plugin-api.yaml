          items:
            type: object
            additionalProperties: true
        review:
          $ref: '#/components/schemas/ImmersiveReview'
        settings:
          type: object
          description: 模板预设。键是能力 id，值是开关或级别。
          additionalProperties: true
        aiTasks:
          type: array
          description: 模板声明的 AI 任务。
          items:
            $ref: '#/components/schemas/AiTaskInfo'
        aiAutoConsentFingerprint:
          type: string
          description: 自动触发的任务需要用户同意一次，该串是同意自动任务时记下的校验值。没有自动任务时是空串。
        sample:
          $ref: '#/components/schemas/ImmersiveSample'
        next:
