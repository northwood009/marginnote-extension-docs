  /notes/{noteid}/edits:
    post:
      tags:
        - 卡片与摘录
      summary: 一次提交多步卡片改动
      operationId: postNotesNoteidEdits
      description: |
        一个动作要改动多项时使用该接口：改标题、加批注、删批注、摘标签、记插件字段，写在一次提交里
        提交，在撤销栈上只占一步。

        MarginNote 先按顺序模拟整批操作，任何一步不通过，整批操作都不写入。一批最多 32 步。删批注必须排在
        摘标签之前，否则返回 `422 INVALID_ORDER`。写入之后 MarginNote 重新读取核对，不一致就把改动过的卡
        整体恢复并返回 `500`。

        `syncReview` 打开时，写完照摘录那一刻的自动入组规则把该卡补进复习卡组，与本次写入同一步撤销。

        这是插件唯一的原子多步写入口。旧版 MarginNote 没有注册该接口时返回 `404`，可以用作能力探测。
      parameters:
        - $ref: '#/components/parameters/Noteid'
      responses:
        '200':
          description: 提交响应。可能还有未列出的字段。
          content:
            application/json:
              schema:
                type: object
                properties:
                  noteid:
                    type: string
                  comments:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        text:
                          type: string
                      required:
                      - index
                      - text
                  applied:
                    type: integer
                    description: 实际执行的步数。
                  hashtags:
                    type: array
                    items:
                      type: string
                  title:
                    type: string
                    description: 写入之后的卡片标题。
                  persisted:
                    type: boolean
                  addonValues:
                    type: object
                    properties: {}
                  bridgeApiVersion:
                    type: string
                  review:
                    type: object
                    description: ⚠️带 `syncReview` 时返回的入组结果。
                    additionalProperties: true
              examples:
                assembled:
                  summary: 构造示例，未实测
                  value:
                    noteid: 5880F73A-3A6D-4464-9D6F-88F60285401E
                    applied: 2
                    title: photosynthesis
                measured:
                  summary: 实测于 2026-10-07，App 0.91
                  value:
                    noteid: D3085422-2CB9-4B68-A78D-DEE351CF9C38
                    comments:
                    - index: 2
                      text: 探针改过的批注。
                    - index: 3
                      text: '#探针'
                    applied: 1
                    hashtags:
                    - '#探针'
                    title: 探针事务标题
                    persisted: true
                    addonValues: {}
                    bridgeApiVersion: '0.91'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteEditsRequest'
            examples:
              writeBack:
                summary: 更新标题、添加释义、移除待办标签、记录状态
                value:
                  ops:
                    - op: setTitle
                      text: photosynthesis
                      expectedPrefix: photo
                    - op: appendComment
                      text: 光合作用：植物把光能转成化学能的过程。
                    - op: deleteComment
                      index: 2
                      expectedPrefix: 旧释义
                    - op: removeHashtags
                      hashtags:
                        - '#VocabPending'
                    - op: setAddonValues
                      values:
                        status: done
                        wrote:
                          - 1
                  confirm: true
                  syncReview: false
      x-codeSamples:
        - lang: javascript
          label: 用一次提交写完一张卡
          source: |
            const r = await mn.api('/notes/' + noteid + '/edits', {
              method: 'POST',
              body: {
                ops: [
                  // 删批注必须排在摘标签之前，否则 422 INVALID_ORDER
                  { op: 'deleteComment', index: 2, expectedPrefix: '旧释义' },
                  { op: 'setTitle', text: 'photosynthesis', expectedPrefix: 'photo' },
                  { op: 'appendComment', text: '光合作用：植物把光能转成化学能的过程。' },
                  { op: 'removeHashtags', hashtags: ['#VocabPending'] },
                  // addon 由 MarginNote 设为本面板的 owner
                  { op: 'setAddonValues', values: { status: 'done' } }
                ],
                confirm: true,
                syncReview: false
              }
            });
            if (r.error) mn.log(r.error.code);

            // 探测 MarginNote 是否注册了该接口
            if (r.error && r.error.code === 'NOT_FOUND') {
              // 旧版 MarginNote 上改用逐条写入的接口
            }
