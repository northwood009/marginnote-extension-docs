  /anki/jobs/{jobId}:
    get:
      tags:
        - 导出与 Anki
      summary: 查询 Anki 作业
      operationId: getAnkiJobsJobId
      description: |
        查询 Anki 导出、预览、校验或检查作业的状态。作业产物是会话内对象，重启或清理后可能返回 `404`。
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 作业状态。可能还有未列出的字段。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnkiJobResponse'
              examples:
                assembled:
                  summary: 构造示例，未实测
                  value:
                    jobId: anki-3F1A2B40
                    state: finished
                    operation: export
                    artifacts:
                    - name: collection.apkg
                      mimeType: application/octet-stream
        '404':
          $ref: '#/components/responses/NotFound'
      x-codeSamples:
        - lang: javascript
          label: 查询作业
          source: |
            const r = await mn.api('/anki/jobs/' + jobId);
            if (r.error) mn.log(r.error.code);
  /anki/jobs/{jobId}/files:
    get:
      tags:
        - 导出与 Anki
      summary: 下载 Anki 作业产物
      operationId: getAnkiJobsJobIdFiles
      description: |
        下载 Anki 作业生成的产物。带 `name` 查询参数指定产物名，例如 `collection.apkg`。
        响应不是 JSON，页面里要用 `fetch` 原语读取 Blob。
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/ArtifactName'
      responses:
        '200':
          description: 作业产物内容。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              examples:
                artifact:
                  summary: 构造示例
                  value: <binary apkg bytes>
            application/zip:
              schema:
                type: string
                format: binary
              examples:
                archive:
                  summary: 构造示例
                  value: <binary zip bytes>
        '404':
          $ref: '#/components/responses/NotFound'
      x-codeSamples:
        - lang: javascript
          label: 下载作业产物
          source: |
            const res = await fetch('/bridge/v1/anki/jobs/' + jobId + '/files?name=' + encodeURIComponent(name));
            const blob = await res.blob();
